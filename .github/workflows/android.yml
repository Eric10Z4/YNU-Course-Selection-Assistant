name: Android build and offline device checks
on:
  push:
    branches: [main]
    paths: ['android/**', 'tests/test_android.py', 'windows/qiangke_web.py', 'windows/desktop_support.py', 'windows/ocr_*', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'tests/test_android.py', 'windows/qiangke_web.py', 'windows/desktop_support.py', 'windows/ocr_*', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  device:
    name: Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure authorized preview signing on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ANDROID_PREVIEW_KEYSTORE_B64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_B64 }}
          ANDROID_PREVIEW_STORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_STORE_PASSWORD }}
        run: python android/prepare_signing.py
      - name: Run recovery scenarios and build both 64-bit ABIs
        run: |
          python -m pip install requests==2.32.5
          python -m unittest discover -s tests -v
          chmod +x android/gradlew
          android/gradlew -p android assembleDebug assemblePreview assembleDebugAndroidTest lintDebug
          python android/verify_apk.py --apk android/app/build/outputs/apk/preview/app-preview.apk --commit '${{ github.sha }}' --output android/app/build/outputs/apk/preview/build-manifest.json
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048
          script: bash android/run_device_checks.sh '${{ matrix.api }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification-api-${{ matrix.api }}
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            reports/
      - uses: actions/upload-artifact@v4
        if: success() && matrix.api == 35
        with:
          name: YNU-android-preview
          path: |
            android/app/build/outputs/apk/preview/app-preview.apk
            android/app/build/outputs/apk/preview/build-manifest.json
          if-no-files-found: error
